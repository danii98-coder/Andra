spring.application.name=andara-javafx
spring.main.web-application-type=none
spring.main.banner-mode=off

spring.datasource.url=jdbc:sqlite:andara.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.root=WARN
logging.level.pe.edu.unaj.andara=INFO

app.seeder.enabled=true

app.institucion.nombre=Universidad Nacional de Juliaca
app.institucion.sigla=UNAJ
app.institucion.telefono=(051) 323200
app.institucion.anexos=0000 / 0000
app.institucion.correo-mesa-partes=mesadepartes@unaj.edu.pe
app.institucion.correo-soporte=soporte.academico@unaj.edu.pe
app.institucion.correo-defensoria=defensoria@unaj.edu.pe
app.institucion.url-youtube=https://www.youtube.com/@universidadnacionaldejulia3566
app.institucion.url-facebook=https://www.facebook.com/UNAJ.Pagina.Oficial
app.institucion.url-documentos=https://sigu.unaj.edu.pe
app.conexion.url-prueba=https://www.google.com
